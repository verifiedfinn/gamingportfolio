name: Update Steam Data

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6am UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions tab

jobs:
  update-steam-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Steam data and write steamgames.json
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const https = require('https');

          function fetchJSON(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { reject(new Error('Failed to parse JSON from ' + url)); }
                });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Fetching Steam hours + recently played...');
            const steamData = await fetchJSON('https://gamingportfolio-mauve.vercel.app/api/steam');

            console.log('Fetching Steam games list...');
            const steamGames = await fetchJSON('https://gamingportfolio-mauve.vercel.app/api/steamgames');

            // Build combined output
            const hoursMap = {};
            steamData.games.forEach(g => {
              hoursMap[g.name.toLowerCase()] = {
                hours: g.hours,
                recentlyPlayed: g.recentlyPlayed
              };
            });

            const games = steamGames.games.map(g => {
              const rawDesc = g.shortDescription || `A game I've put ${g.hours} hours into.`;
              const shortDesc = rawDesc.length > 80 ? rawDesc.substring(0, 80).trimEnd() + '...' : rawDesc;
              const hoursData = hoursMap[g.name.toLowerCase()] || {};
              return {
                Name: g.name,
                Tags: ["Steam"],
                FirstSentence: shortDesc,
                RemainingDescription: g.description || 'No description available.',
                Image: g.image,
                Link: g.link,
                Hours: hoursData.hours || g.hours,
                RecentlyPlayed: hoursData.recentlyPlayed || false,
                SteamAutoAdded: true
              };
            });

            // Also write hours map separately so JS can update existing gameinfo.json games
            const output = {
              updatedAt: new Date().toISOString(),
              hoursMap: hoursMap,
              games: games
            };

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/steamgames.json', JSON.stringify(output, null, 4), 'utf8');
            console.log(`Done. Wrote ${games.length} Steam games to data/steamgames.json`);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit steamgames.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/steamgames.json
          git diff --staged --quiet || git commit -m "chore: update steamgames.json [skip ci]"
          git push