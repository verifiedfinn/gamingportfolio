    <script>
(function () {
  try {
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) return;
    var BASE = "https://raw.githubusercontent.com/verifiedfinn/site-assets/main/cursors/";
    var isFirefox = navigator.userAgent.toLowerCase().indexOf("firefox") > -1;
    var ext = isFirefox ? "png" : "cur";
    var cursors = {
      default:    "url('" + BASE + "cursor_normal."  + ext + "') 0 0, auto",
      pointer:    "url('" + BASE + "cursor_link."    + ext + "') 12 2, pointer",
      text:       "url('" + BASE + "cursor_text."    + ext + "') 16 16, text",
      notAllowed: "url('" + BASE + "cursor_unavail." + ext + "') 0 0, not-allowed"
    };
    document.documentElement.style.cursor = cursors.default;
    document.addEventListener("mouseover", function (e) {
      var t   = e.target.closest("a, button, [role='button'], input[type='submit'], input[type='button']");
      var inp = e.target.closest("input:not([type='submit']):not([type='button']), textarea, [contenteditable]");
      if (t)   { t.style.cursor   = cursors.pointer; return; }
      if (inp) { inp.style.cursor = cursors.text;    return; }
    });
    document.addEventListener("mouseout", function (e) {
      var t   = e.target.closest("a, button, [role='button'], input[type='submit'], input[type='button']");
      var inp = e.target.closest("input:not([type='submit']):not([type='button']), textarea, [contenteditable]");
      if (t)   { t.style.cursor   = ""; return; }
      if (inp) { inp.style.cursor = ""; return; }
    });
  } catch (e) {
    console.warn("[Tron Cursor] Could not apply custom cursors:", e);
  }
})();
</script>

    /* background pulse animation layer */
    #radial-canvas {
        position: absolute;

          icon:'<rect x="1" y="1" width="12" height="12" stroke="#00d9ff" stroke-width="1.3" fill="none"/><rect x="3" y="3" width="8" height="8" stroke="#00d9ff" stroke-width="0.8" fill="none"/><rect x="5" y="5" width="4" height="4" fill="#00d9ff" opacity="0.4"/><rect x="6" y="6" width="2" height="2" fill="#00d9ff"/>' },
    ];

    let radialOpen = false;
    let radialNodes = [];
    let radialBuilt = false;
    let traceMeta = [];
    let gridAnimFrame = null;

    function startGrid() {
        const canvas = document.getElementById('radial-canvas');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const W = canvas.width;
        const H = canvas.height;
        const size = 44;
        const PULSE_LEN = 260;
        const MAX_PULSES = 5;
        const pulses = [];

        if (gridAnimFrame) {
            cancelAnimationFrame(gridAnimFrame);
            gridAnimFrame = null;
        }

        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = W;
        gridCanvas.height = H;
        const gCtx = gridCanvas.getContext('2d');
        gCtx.strokeStyle = 'rgba(0,217,255,0.035)';
        gCtx.lineWidth = 0.5;

        for (let x = 0; x <= W; x += size) {
            gCtx.beginPath();
            gCtx.moveTo(x, 0);
            gCtx.lineTo(x, H);
            gCtx.stroke();
        }

        for (let y = 0; y <= H; y += size) {
            gCtx.beginPath();
            gCtx.moveTo(0, y);
            gCtx.lineTo(W, y);
            gCtx.stroke();
        }

        function spawnPulse() {
            const horiz = Math.random() > 0.5;
            if (horiz) {
                const row = Math.floor(Math.random() * Math.ceil(H / size)) * size;
                const dir = Math.random() > 0.5 ? 1 : -1;
                pulses.push({
                    horiz,
                    x: dir > 0 ? 0 : W,
                    y: row,
                    dir,
                    speed: 0.9 + Math.random() * 0.6,
                    alpha: 0
                });
            } else {
                const col = Math.floor(Math.random() * Math.ceil(W / size)) * size;
                const dir = Math.random() > 0.5 ? 1 : -1;
                pulses.push({
                    horiz,
                    x: col,
                    y: dir > 0 ? 0 : H,
                    dir,
                    speed: 0.9 + Math.random() * 0.6,
                    alpha: 0
                });
            }
        }

        for (let i = 0; i < MAX_PULSES; i++) {
            setTimeout(() => spawnPulse(), i * 500 + Math.random() * 300);
        }

        let spawnTimer = 0;

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(gridCanvas, 0, 0);

            spawnTimer++;
            if (spawnTimer > 70 && pulses.length < MAX_PULSES) {
                spawnPulse();
                spawnTimer = 0;
            }

            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                if (p.horiz) p.x += p.dir * p.speed;
                else p.y += p.dir * p.speed;
                p.alpha = Math.min(1, p.alpha + 0.02);

                const gone = p.horiz
                    ? (p.dir > 0 ? p.x > W + PULSE_LEN : p.x < -PULSE_LEN)
                    : (p.dir > 0 ? p.y > H + PULSE_LEN : p.y < -PULSE_LEN);

                if (gone) {
                    pulses.splice(i, 1);
                    continue;
                }

                const hx = p.x, hy = p.y;
                const tx = p.horiz ? hx - p.dir * PULSE_LEN : hx;
                const ty = p.horiz ? hy : hy - p.dir * PULSE_LEN;

                ctx.save();
                ctx.globalAlpha = p.alpha;

                const grad = p.horiz
                    ? ctx.createLinearGradient(tx, hy, hx, hy)
                    : ctx.createLinearGradient(hx, ty, hx, hy);

                grad.addColorStop(0,   'rgba(0,217,255,0)');
                grad.addColorStop(0.7, 'rgba(0,217,255,0.06)');
                grad.addColorStop(1,   'rgba(0,217,255,0.55)');

                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(hx, hy);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1;
                ctx.stroke();

                const glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, 14);
                glow.addColorStop(0,   'rgba(0,217,255,0.22)');
                glow.addColorStop(0.4, 'rgba(0,217,255,0.06)');
                glow.addColorStop(1,   'rgba(0,217,255,0)');
                ctx.beginPath();
                ctx.arc(hx, hy, 14, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                ctx.restore();
            }

            gridAnimFrame = requestAnimationFrame(draw);
        }

        gridAnimFrame = requestAnimationFrame(draw);
    }

    function stopGrid() {
        if (gridAnimFrame) {
            cancelAnimationFrame(gridAnimFrame);
            gridAnimFrame = null;
        }

        const canvas = document.getElementById('radial-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    function clearRadialVisuals() {
        const linesSvg = document.getElementById('radial-lines-svg');
        const wheel = document.getElementById('radial-wheel');
        if (linesSvg) linesSvg.innerHTML = '';
        if (wheel) wheel.innerHTML = '';
        radialNodes = [];
        traceMeta = [];
        radialBuilt = false;
    }

    function buildRadialWheel() {
        clearRadialVisuals();

        const W  = window.innerWidth;
        const H  = window.innerHeight;
        const cx = W / 2;
        const cy = H / 2;
        const r  = Math.min(W, H) * 0.36;

        const center = document.getElementById('radial-center');
        center.style.left = cx + 'px';
        center.style.top  = cy + 'px';

        const linesSvg = document.getElementById('radial-lines-svg');
        const wheel    = document.getElementById('radial-wheel');

        linesSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        linesSvg.setAttribute('preserveAspectRatio', 'none');

        pages.forEach((page, i) => {
            const angle = (i / pages.length) * 2 * Math.PI - Math.PI / 2;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;

            const midRadius = r * 0.52;
            const mx = cx + Math.cos(angle) * midRadius;
            const my = cy + Math.sin(angle) * midRadius;

            const perpX = -Math.sin(angle) * 16;
            const perpY =  Math.cos(angle) * 16;

            const c1x = cx + (mx - cx) * 0.45 + perpX * 0.35;
            const c1y = cy + (my - cy) * 0.45 + perpY * 0.35;
            const c2x = mx + perpX;
            const c2y = my + perpY;

            const d = `M ${cx} ${cy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x} ${y}`;

            const basePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            basePath.setAttribute('d', d);
            basePath.setAttribute('class', 'trace-line');
            linesSvg.appendChild(basePath);

            const glowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            glowPath.setAttribute('d', d);
            glowPath.setAttribute('class', 'trace-line-glow');
            linesSvg.appendChild(glowPath);

            const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            pulse.setAttribute('cx', x);
            pulse.setAttribute('cy', y);
            pulse.setAttribute('r', '2.2');
            pulse.setAttribute('class', 'trace-pulse');
            linesSvg.appendChild(pulse);

            const length = glowPath.getTotalLength();
            glowPath.style.strokeDasharray = `${length}`;
            glowPath.style.strokeDashoffset = `${length}`;

            traceMeta.push({
                glowPath,
                pulse,
                length,
                delay: i * 0.055
            });

            const node = document.createElement('div');
            node.className = 'rnode';
            node.style.left = x + 'px';
            node.style.top  = y + 'px';
            node.style.transitionDelay = (0.18 + i * 0.045) + 's';
            node.innerHTML = `<a href="${page.url}">
                <div class="rnode-icon">
                    <svg width="22" height="22" viewBox="0 0 14 14">${page.icon}</svg>
                </div>
                <span class="rnode-label">${page.label}</span>
            </a>`;
            wheel.appendChild(node);
            radialNodes.push(node);
        });

        radialBuilt = true;
    }

    function animateTraceIn() {
        traceMeta.forEach(({ glowPath, pulse, length, delay }) => {
            glowPath.animate(
                [
                    { strokeDashoffset: length, opacity: 0.0 },
                    { strokeDashoffset: 0, opacity: 1.0 }
                ],
                {
                    duration: 700,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    fill: 'forwards'
                }
            );

            pulse.animate(
                [
                    { opacity: 0, transform: 'scale(0.2)', transformOrigin: 'center' },
                    { opacity: 1, transform: 'scale(1.35)', offset: 0.55, transformOrigin: 'center' },
                    { opacity: 0.75, transform: 'scale(1)', transformOrigin: 'center' }
                ],
                {
                    duration: 620,
                    delay: (delay * 1000) + 430,
                    easing: 'ease-out',
                    fill: 'forwards'
                }
            );
        });
    }

    function animateTraceOut() {
        traceMeta.forEach(({ glowPath, pulse, length }, index) => {
            const reverseDelay = (traceMeta.length - 1 - index) * 35;

            glowPath.animate(
                [
                    { strokeDashoffset: 0, opacity: 1 },
                    { strokeDashoffset: -length * 0.15, opacity: 0 }
                ],
                {
                    duration: 240,
                    delay: reverseDelay,
                    easing: 'ease-in',
                    fill: 'forwards'
                }
            );

            pulse.animate(
                [
                    { opacity: 0.75, transform: 'scale(1)', transformOrigin: 'center' },
                    { opacity: 0, transform: 'scale(0.5)', transformOrigin: 'center' }
                ],
                {
                    duration: 160,
                    delay: reverseDelay,
                    easing: 'ease-in',
                    fill: 'forwards'
                }
            );
        });
    }

    function toggleRadialMenu() {
        radialOpen ? closeRadialMenu() : openRadialMenu();
    }

    function openRadialMenu() {
        if (!radialBuilt) buildRadialWheel();

        radialOpen = true;
        document.getElementById('radial-overlay').classList.add('open');
        document.getElementById('nav-menu-btn').innerHTML = `
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <line x1="2" y1="2" x2="14" y2="14" stroke="#00d9ff" stroke-width="2.5"/>
                <line x1="14" y1="2" x2="2" y2="14" stroke="#00d9ff" stroke-width="2.5"/>
            </svg>`;
        document.getElementById('nav-menu-btn').style.boxShadow = '0 0 18px rgba(0,217,255,0.8)';

        startGrid();
        animateTraceIn();
        radialNodes.forEach(n => n.classList.add('vis'));
    }

    function closeRadialMenu() {
        radialOpen = false;
        document.getElementById('radial-overlay').classList.remove('open');
        document.getElementById('nav-menu-btn').innerHTML = `
            <svg width="20" height="16" viewBox="0 0 20 16" fill="none">
                <rect x="0" y="0" width="20" height="2" fill="#00d9ff"/>
                <rect x="4" y="7" width="16" height="2" fill="#00d9ff"/>
                <rect x="8" y="14" width="12" height="2" fill="#00d9ff"/>
            </svg>`;
        document.getElementById('nav-menu-btn').style.boxShadow = '0 0 10px rgba(0,217,255,0.4)';

        stopGrid();
        animateTraceOut();

        radialNodes.forEach((n, i) => {
            n.style.transitionDelay = ((radialNodes.length - 1 - i) * 0.02) + 's';
            n.classList.remove('vis');
        });

        setTimeout(() => {
            if (!radialOpen) clearRadialVisuals();
        }, 420);
    }

    function handleRadialOverlayClick(e) {
        if (!e.target.closest('.rnode') && !e.target.closest('#nav-menu-btn')) {
            closeRadialMenu();
        }
    }

    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) return;
        stopGrid();
        if (radialOpen) {
            buildRadialWheel();
            startGrid();
            requestAnimationFrame(() => {
                radialNodes.forEach(n => n.classList.add('vis'));
                animateTraceIn();
            });
        } else {
            clearRadialVisuals();
        }
    });

    window.toggleRadialMenu = toggleRadialMenu;
    window.handleRadialOverlayClick = handleRadialOverlayClick;

    } // end mobile only
    </script>

    <script>
    /* Report our full content height to the parent frame (the Wix embed) so it
       can grow to fit — no inner scrollbar; the Wix page scrolls (its dark bar)
       and the footer sits after all our content. No-op when opened directly. */
    (function () {
        if (window.parent === window) return; // not embedded — nothing to do
        var last = 0;
        function measure() {
            return Math.max(
                document.body.scrollHeight, document.documentElement.scrollHeight,
                document.body.offsetHeight, document.documentElement.offsetHeight
            );
        }
        function send(force) {
            var h = measure();
            // ignore sub-24px wobble so the footer doesn't jitter while scrolling
            if (!force && Math.abs(h - last) < 24) return;
            last = h;
            // +6px so the iframe is never SHORT — a short iframe traps the wheel
            window.parent.postMessage({ type: 'site-height', h: h + 6 }, '*');
        }
        window.addEventListener('load', function () { send(true); });
        window.addEventListener('resize', function () { send(true); });
        // calm low-frequency poll: catches filter/sort/expand changes without the
        // bursty reflow that a ResizeObserver caused (that was the jitter source)
        setInterval(function () { send(false); }, 750);
        // catch late async content settling right after load
        [200, 600, 1200, 2500, 4000].forEach(function (t) { setTimeout(function () { send(true); }, t); });
        send(true);

        // Forward the mouse wheel to the parent page. A cross-origin iframe does
        // not chain the wheel to its embedder, so without this, scrolling with the
        // wheel over this frame does nothing. We have no inner scroll (full height),
        // so it's safe to forward everything.
        window.addEventListener('wheel', function (e) {
            var dy = e.deltaY, dx = e.deltaX;
            if (e.deltaMode === 1) { dy *= 16; dx *= 16; }            // lines -> px
            else if (e.deltaMode === 2) { dy *= window.innerHeight; dx *= window.innerWidth; } // pages
            window.parent.postMessage({ type: 'scroll-by', dy: dy, dx: dx }, '*');
        }, { passive: true });
    })();
    </script>
