    <script>
(function () {
  try {
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) return;
    var BASE = "https://raw.githubusercontent.com/verifiedfinn/site-assets/main/cursors/";
    var isFirefox = navigator.userAgent.toLowerCase().indexOf("firefox") > -1;
    var ext = isFirefox ? "png" : "cur";
    var cursors = {
      default:    "url('" + BASE + "cursor_normal."  + ext + "') 0 0, auto",
      pointer:    "url('" + BASE + "cursor_link."    + ext + "') 12 2, pointer",
      text:       "url('" + BASE + "cursor_text."    + ext + "') 16 16, text",
      notAllowed: "url('" + BASE + "cursor_unavail." + ext + "') 0 0, not-allowed"
    };
    document.documentElement.style.cursor = cursors.default;
    document.addEventListener("mouseover", function (e) {
      var t   = e.target.closest("a, button, [role='button'], input[type='submit'], input[type='button']");
      var inp = e.target.closest("input:not([type='submit']):not([type='button']), textarea, [contenteditable]");
      if (t)   { t.style.cursor   = cursors.pointer; return; }
      if (inp) { inp.style.cursor = cursors.text;    return; }
    });
    document.addEventListener("mouseout", function (e) {
      var t   = e.target.closest("a, button, [role='button'], input[type='submit'], input[type='button']");
      var inp = e.target.closest("input:not([type='submit']):not([type='button']), textarea, [contenteditable]");
      if (t)   { t.style.cursor   = ""; return; }
      if (inp) { inp.style.cursor = ""; return; }
    });
  } catch (e) {
    console.warn("[Tron Cursor] Could not apply custom cursors:", e);
  }
})();
</script>

        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
        padding: 0;
        flex-shrink: 0;
    }

    /* Radial overlay */
    #radial-overlay {
        position: fixed !important;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: transparent;
        pointer-events: none;
        transition: background 0.35s;
        z-index: 999998;
        overflow: hidden;
    }

    #radial-overlay.open {
        background: rgba(0,5,15,0.96);
        pointer-events: auto;
    }

    /* Animated grid canvas */
    #radial-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.4s;
    }

    #radial-overlay.open #radial-canvas {
        opacity: 1;
    }

    #radial-lines-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
    }

    #radial-overlay.open #radial-lines-svg {
        opacity: 0.4;
    }

    #radial-center {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #00d9ff;
        box-shadow: 0 0 20px #00d9ff, 0 0 40px rgba(0,217,255,0.5);
        transform: translate(-50%, -50%) scale(0);
        transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        pointer-events: none;
    }

    #radial-overlay.open #radial-center {

          icon:'<rect x="5" y="1" width="4" height="7" rx="2" stroke="#00d9ff" stroke-width="1.3" fill="none"/><path d="M3 7c0 2.8 8 2.8 8 0" stroke="#00d9ff" stroke-width="1.3" fill="none" stroke-linecap="square"/><line x1="7" y1="10" x2="7" y2="13" stroke="#00d9ff" stroke-width="1.3"/><line x1="5" y1="13" x2="9" y2="13" stroke="#00d9ff" stroke-width="1.3"/>' },

        { label:'Contact',         url:'https://www.finnhorgan.com/contact',
          icon:'<rect x="1" y="3" width="12" height="8" stroke="#00d9ff" stroke-width="1.3" fill="none"/><polyline points="1,3 7,9 13,3" stroke="#00d9ff" stroke-width="1.3" fill="none" stroke-linejoin="miter"/>' },
        { label:'Player Profile',  url:'https://verifiedfinn.github.io/gamingportfolio',
          icon:'<rect x="1" y="1" width="12" height="12" stroke="#00d9ff" stroke-width="1.3" fill="none"/><rect x="3" y="3" width="8" height="8" stroke="#00d9ff" stroke-width="0.8" fill="none"/><rect x="5" y="5" width="4" height="4" fill="#00d9ff" opacity="0.4"/><rect x="6" y="6" width="2" height="2" fill="#00d9ff"/>' },
    ];

    let radialOpen = false;
    let radialNodes = [];
    let radialBuilt = false;
    let gridAnimFrame = null;

    function startGrid() {
        const canvas = document.getElementById('radial-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const W = canvas.width, H = canvas.height;
        const size = 44;
        const PULSE_LEN = 260;
        const MAX_PULSES = 5;
        const pulses = [];

        // Pre-draw static grid to offscreen canvas so we don't redraw it every frame
        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = W; gridCanvas.height = H;
        const gCtx = gridCanvas.getContext('2d');
        gCtx.strokeStyle = 'rgba(0,217,255,0.035)';
        gCtx.lineWidth = 0.5;
        for (let x = 0; x <= W; x += size) {
            gCtx.beginPath(); gCtx.moveTo(x, 0); gCtx.lineTo(x, H); gCtx.stroke();
        }
        for (let y = 0; y <= H; y += size) {
            gCtx.beginPath(); gCtx.moveTo(0, y); gCtx.lineTo(W, y); gCtx.stroke();
        }

        function spawnPulse() {
            const horiz = Math.random() > 0.5;
            if (horiz) {
                const row = Math.floor(Math.random() * Math.ceil(H / size)) * size;
                const dir = Math.random() > 0.5 ? 1 : -1;
                pulses.push({ horiz, x: dir > 0 ? 0 : W, y: row, dir, speed: 0.9 + Math.random() * 0.6, alpha: 0 });
            } else {
                const col = Math.floor(Math.random() * Math.ceil(W / size)) * size;
                const dir = Math.random() > 0.5 ? 1 : -1;
                pulses.push({ horiz, x: col, y: dir > 0 ? 0 : H, dir, speed: 0.9 + Math.random() * 0.6, alpha: 0 });
            }
        }

        for (let i = 0; i < MAX_PULSES; i++) {
            setTimeout(() => spawnPulse(), i * 500 + Math.random() * 300);
        }

        let spawnTimer = 0;

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(gridCanvas, 0, 0);

            spawnTimer++;
            if (spawnTimer > 70 && pulses.length < MAX_PULSES) { spawnPulse(); spawnTimer = 0; }

            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.horiz ? p.x += p.dir * p.speed : p.y += p.dir * p.speed;
                p.alpha = Math.min(1, p.alpha + 0.02);

                const gone = p.horiz
                    ? (p.dir > 0 ? p.x > W + PULSE_LEN : p.x < -PULSE_LEN)
                    : (p.dir > 0 ? p.y > H + PULSE_LEN : p.y < -PULSE_LEN);
                if (gone) { pulses.splice(i, 1); continue; }

                const hx = p.x, hy = p.y;
                const tx = p.horiz ? hx - p.dir * PULSE_LEN : hx;
                const ty = p.horiz ? hy : hy - p.dir * PULSE_LEN;

                // Single smooth gradient line — no repaints, no artifacts
                ctx.save();
                ctx.globalAlpha = p.alpha;
                const grad = p.horiz
                    ? ctx.createLinearGradient(tx, hy, hx, hy)
                    : ctx.createLinearGradient(hx, ty, hx, hy);
                grad.addColorStop(0,   'rgba(0,217,255,0)');
                grad.addColorStop(0.7, 'rgba(0,217,255,0.06)');
                grad.addColorStop(1,   'rgba(0,217,255,0.55)');
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(hx, hy);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1;
                ctx.stroke();

                // Soft ethereal glow at head only
                const glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, 14);
                glow.addColorStop(0,   'rgba(0,217,255,0.22)');
                glow.addColorStop(0.4, 'rgba(0,217,255,0.06)');
                glow.addColorStop(1,   'rgba(0,217,255,0)');
                ctx.beginPath();
                ctx.arc(hx, hy, 14, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();
                ctx.restore();
            }

            gridAnimFrame = requestAnimationFrame(draw);
        }

        gridAnimFrame = requestAnimationFrame(draw);
    }

    function stopGrid() {
        if (gridAnimFrame) { cancelAnimationFrame(gridAnimFrame); gridAnimFrame = null; }
    }

    function buildRadialWheel() {
        if (radialBuilt) return;
        radialBuilt = true;

        const W  = window.innerWidth;
        const H  = window.innerHeight;
        const cx = W / 2;
        const cy = H / 2;
        const r  = Math.min(W, H) * 0.36;

        const center = document.getElementById('radial-center');
        center.style.left = cx + 'px';
        center.style.top  = cy + 'px';

        const linesSvg = document.getElementById('radial-lines-svg');
        const wheel    = document.getElementById('radial-wheel');

        pages.forEach((page, i) => {
            const angle = (i / pages.length) * 2 * Math.PI - Math.PI / 2;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', cx); line.setAttribute('y1', cy);
            line.setAttribute('x2', x);  line.setAttribute('y2', y);
            line.setAttribute('stroke', '#00d9ff');
            line.setAttribute('stroke-width', '0.5');
            line.setAttribute('stroke-dasharray', '4 4');
            linesSvg.appendChild(line);

            const node = document.createElement('div');
            node.className = 'rnode';
            node.style.left = x + 'px';
            node.style.top  = y + 'px';
            node.style.transitionDelay = (i * 0.04) + 's';
            node.innerHTML = `<a href="${page.url}">
                <div class="rnode-icon">
                    <svg width="22" height="22" viewBox="0 0 14 14">${page.icon}</svg>
                </div>
                <span class="rnode-label">${page.label}</span>
            </a>`;
            wheel.appendChild(node);
            radialNodes.push(node);
        });
    }

    function toggleRadialMenu() {
        radialOpen ? closeRadialMenu() : openRadialMenu();
    }

    function openRadialMenu() {
        buildRadialWheel();
        radialOpen = true;
        document.getElementById('radial-overlay').classList.add('open');
        document.getElementById('nav-menu-btn').innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="2" y1="2" x2="14" y2="14" stroke="#00d9ff" stroke-width="2.5"/><line x1="14" y1="2" x2="2" y2="14" stroke="#00d9ff" stroke-width="2.5"/></svg>`;
        document.getElementById('nav-menu-btn').style.boxShadow = '0 0 18px rgba(0,217,255,0.8)';
        startGrid();
        radialNodes.forEach(n => n.classList.add('vis'));
    }

    function closeRadialMenu() {
        radialOpen = false;
        document.getElementById('radial-overlay').classList.remove('open');
        document.getElementById('nav-menu-btn').innerHTML = `<svg width="20" height="16" viewBox="0 0 20 16" fill="none"><rect x="0" y="0" width="20" height="2" fill="#00d9ff"/><rect x="4" y="7" width="16" height="2" fill="#00d9ff"/><rect x="8" y="14" width="12" height="2" fill="#00d9ff"/></svg>`;
        document.getElementById('nav-menu-btn').style.boxShadow = '0 0 10px rgba(0,217,255,0.4)';
        stopGrid();
        radialNodes.forEach((n, i) => {
            n.style.transitionDelay = ((radialNodes.length - 1 - i) * 0.025) + 's';
            n.classList.remove('vis');
        });
    }

    function handleRadialOverlayClick(e) {
        if (!e.target.closest('.rnode')) closeRadialMenu();
    }

    window.toggleRadialMenu = toggleRadialMenu;
    window.handleRadialOverlayClick = handleRadialOverlayClick;

    } // end mobile only
    </script>
</body>
</html>
